name: Refresh contribution grid

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-grid
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contribution calendar and render SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query {
            user(login: "BonJenn") {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                      weekday
                    }
                  }
                }
              }
            }
          }' > "$RUNNER_TEMP/contributions.json"
          python3 scripts/render_contributions.py < "$RUNNER_TEMP/contributions.json"
      - name: Save updated grid
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions-light.svg assets/contributions-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution grid'
            git push
          fi
